source:
  chapitre: 9
  objet: "Tableau 4"
  titre: "Référents ethno-nationaux mentionnés par les descendant·es d’immigré·es selon l’origine et le lien à la migration (en %)"
  auteurs: "Mathieu Ferry, Patrick Simon"
  url: "https://books.openedition.org/ined/26373"
  emplacement: "§32"
  image: "data/raw/spike/teo2/ch09/TABLEAUX_CHAP_9_4.jpg.jpg"
  champ: "Descendant·es d’immigré·es et d’originaires des Outre-mer âgé·es de 18 à 59 ans (les lignes G1 et Population majoritaire figurent dans le tableau à titre de comparaison)"
  unite: "%"
  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Champ : descendant·es d’immigré·es et d’originaires des Outre-mer âgé·es de 18 à 59 ans. Lecture : 46 % des G2 du Maghreb ont seulement cité la France comme origine, 14 % ont cité un autre pays, 32 % ont combiné la France et un autre pays et 8 % n’ont cité aucun des deux. Note : la liste complète des pays est donnée en annexe B de l’introduction de l’ouvrage. Les catégories de population (population majoritaire, G1, G2, etc.) sont définies dans l’annexe A. Saisie : aucune cellule vide. ANOMALIE : la ligne G1 somme à 123 (15 + 73 + 17 + 18), alors que les autres lignes somment à 99-101 ; relu deux fois sur un agrandissement, la valeur imprimée est bien celle-ci. Le texte (§32) dit seulement que « trois quarts des immigré·es » mentionnent un autre pays (73 %). Une coquille d’impression est probable sur la ligne G1 (colonnes « Combinaison » ou « Autre ») : ne pas l’utiliser comme répartition. Les « 39 % » du cadrage sont la ligne « G2 (2 parents immigrés) », colonne « France seule »."
