  objet: "Texte (hors tableau)"
  titre: "Part de la population ayant un lien à l’immigration par ascendance ou par alliance (41 %)"
  auteurs: "Mathieu Ferry, Pierre Tanneau, Patrick Simon"
  url: "https://books.openedition.org/ined/26366"
