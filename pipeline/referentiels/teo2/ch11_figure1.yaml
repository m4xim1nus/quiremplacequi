source:
  chapitre: 11
  objet: "Figure 1"
  titre: "Risques nets de chômage chez les actifs selon l’origine (effets marginaux par rapport à la population majoritaire)"
  auteurs: "Dominique Meurs, Mathieu Ichou, Emmanuel Valat"
  url: "https://books.openedition.org/ined/26387"
  emplacement: "§10 (figure appelée au §10 ; commentée aux §11-12)"
  image: "data/raw/spike/teo2/ch11/Chap11_Figure1.jpg.jpg"
  champ: "Actifs (France métropolitaine, 18-59 ans), écart par rapport à la population majoritaire à caractéristiques identiques (âge, diplôme, arrivée avant 16 ans, couple mixte, nationalité, vie en couple, santé, français, QPV, région)"
  unite: "points de pourcentage"
  note: "Figure à deux panneaux (Hommes, Femmes) : points = effets marginaux, barres = intervalles de confiance ; AUCUNE ÉTIQUETTE. Valeurs LUES SUR LE GRAPHIQUE : position du centre de chaque point mesurée par traitement d’image (échelle des axes calée sur les graduations, 13,1 pixels par point), arrondie au dixième ; précision retenue ± 0,5 point (largeur du marqueur et résolution de l’image). Les intervalles de confiance ne sont pas saisis. Lignes dans l’ordre de la figure. Les valeurs de l’image ne sont pas toutes significatives (l’intervalle contient 0 pour beaucoup) : le texte (§11) retient comme sur-chômage les immigrés et descendants du Maghreb et les descendants d’Afrique subsaharienne (hommes) ; pour les femmes, aussi les immigrées d’Afrique subsaharienne, Turquie et Moyen-Orient. Contradiction texte/figure : la conclusion (§35) écrit hommes d’Afrique du Nord +11 / descendants +7 et femmes +4 / +6, alors que la figure donne hommes ≈ +6 / +6 et femmes ≈ +11,7 / +6 : ne pas citer le §35."
