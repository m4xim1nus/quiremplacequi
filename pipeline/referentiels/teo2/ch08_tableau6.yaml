  unite: "%"
  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Champ : ensemble des enfants des enquêté·es qui sont descendant·es G3. Lecture : 24 % des descendant·es G3 originaires du Maghreb ont quatre grands-parents immigrés. Note : résultats pondérés avec la pondération des répondant·es de l’enquête. La liste complète des pays est donnée en annexe B de l’introduction de l’ouvrage. Les catégories de population (population majoritaire, G1, G2, etc.) sont définies dans l’annexe A. Saisie : colonnes sous l’en-tête « Origine géographique ». Les lignes « De la même lignée » et « De lignée différente » détaillent la ligne « 2 grands-parents immigrés ». Anomalie dans la source : l’effectif non pondéré « 2 532 » figure à la fois pour le Maghreb et pour l’Europe du Sud (coquille probable, l’un des deux est faux ; non corrigé). La ligne « Effectif non pondéré » est en effectif."
