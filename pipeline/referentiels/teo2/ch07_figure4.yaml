  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Lecture : 10 % des hommes descendants d’immigré·es sont en couple avec une personne immigrée de la même origine. Note : résultats pondérés. Saisie : barres empilées, valeurs lues sur les étiquettes de la figure. Les segments trop fins pour porter une étiquette sont marqués approx (± 1 point) : valeur = 100 − somme des étiquettes de la barre (0 si celle-ci fait déjà 100). §24 : « Trois quarts des enfants d’un parent immigré sont en couple avec un natif ou une native ». Libellé imprimé « Deux parents immigrés (G.2) », saisi « (G2) ». Seconde lecture indépendante le 2026-11-16 : 160 cellules identiques. Ne pas confondre avec le tableau 3 du ch. 8 (champ et catégories différents)."
