source:
  chapitre: 7
  objet: "Figure 3"
  titre: "Origine du ou de la conjoint·e des immigré·es (%)"
  auteurs: "Ognjen Obucina, Ariane Pailhé"
  url: "https://books.openedition.org/ined/26359"
  emplacement: "§21 (figure appelée au §21 ; commentée aux §21-23)"
  image: "data/raw/spike/teo2/ch07/Chap7_fig3.jpg.jpg"
  champ: "Immigré·es en couple, âgé·es de 18 à 59 ans, qui ont rencontré leur conjoint·e actuel·le après la migration (France métropolitaine)"
  unite: "%"
  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Lecture : 45 % des hommes immigrés sont en couple avec une personne immigrée née dans le même pays. Note : résultats pondérés. Saisie : barres empilées, valeurs lues sur les étiquettes de la figure. Les segments trop fins pour porter une étiquette sont marqués approx (± 1 point) : valeur = 100 − somme des étiquettes de la barre (0 si celle-ci fait déjà 100). Champ restreint aux unions formées après la migration (§4, §9) : les couples formés avant l'arrivée en sont exclus. Seconde lecture indépendante le 2026-11-16 : 160 cellules identiques (figures 3 et 4). Ne pas confondre avec le tableau 3 du ch. 8 (champ et catégories différents)."
