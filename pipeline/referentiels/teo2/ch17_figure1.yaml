source:
  chapitre: 17
  objet: "Figure 1"
  titre: "Descendance finale des femmes selon le lien à la migration, la région d’origine et le niveau de diplôme"
  auteurs: "Didier Reynaud"
  url: "https://books.openedition.org/ined/26429"
  emplacement: "§10 (2,32 ; 1,87) et §14 (G2 1,87 ; 1,92 deux parents ; 1,81 couple mixte)"
  image: "data/raw/spike/teo2/ch17/Chap17_fig1.jpg.jpg"
  champ: "Femmes nées entre 1960 et 1974 (France métropolitaine), en fin de vie féconde ; G1 : immigrées ou nées dans les Outre-mer ; naissances à l’étranger avant la migration comprises"
  unite: "enfants par femme"
  note: "Trois panneaux de barres horizontales (G1, G2, Population majoritaire) ; chaque barre porte son étiquette, donc valeurs lues et non estimées (approx: false). Pas de note dans l’image. Saisie : la ligne « Ensemble » correspond aux barres de tête étiquetées « G1 », « G2 » et « Pop. maj. » dans l’image ; les panneaux ont les groupes de lignes « Région d’origine » (Europe du Sud à Outre-mer) et « Niveau de diplôme » (Aucun, CEP, brevet à Bac + 3 et plus). Les barres G2 d’Afrique sub., Asie, Autres pays et Outre-mer sont en gris clair, sans légende dans l’image ni dans le texte (par analogie avec le tableau 1, probablement des effectifs faibles : valeurs à prendre avec prudence). Cellules vides : Turquie, MO en G2 (non représentée) et les lignes de région d’origine pour la population majoritaire. Autres valeurs du texte : G2 de deux parents immigrés 1,92 et de couple mixte 1,81 (§14), non présentes dans la figure."
