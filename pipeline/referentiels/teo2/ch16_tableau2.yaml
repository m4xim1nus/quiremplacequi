source:
  chapitre: 16
  objet: "Tableau 2"
  titre: "Indicateurs de discrimination selon l’origine et le lien à la migration (%)"
  auteurs: "Haley McAvay, Jean-Luc Primon, Mirna Safi, Patrick Simon"
  url: "https://books.openedition.org/ined/26422"
  emplacement: "§9"
  image: "data/raw/spike/teo2/ch16/TABLEAUX_CHAP_16_2.jpg.jpg"
  champ: "Individus âgés de 18 à 59 ans (France métropolitaine) ; discriminations autodéclarées : au cours des cinq dernières années"
  unite: "%"
  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Champ : individus âgés de 18 à 59 ans. Lecture : 22 % des G1 ont rapporté au moins une discrimination situationnelle et 24 % ont déclaré avoir été discriminés dans les cinq dernières années ; 35 % des G1 ont déclaré au moins une discrimination sur l’un des deux indicateurs. Parmi les personnes qui ont rapporté une discrimination situationnelle, 73 % ont mentionné un motif ethnoracial (origine et/ou couleur de peau). Note : pourcentages pondérés, effectifs non pondérés disponibles en annexe de l’ouvrage. Saisie : l’en-tête « Discriminations » couvre les colonnes « Situationnelles » et « Autodéclarées » (libellés complétés). Colonnes non additives (indicateurs distincts, la 3e est l’union des deux premières). Aucune cellule vide. Le 14 % de la ligne « Population majoritaire » est un taux de 2019-2020 ; le 14 % de 2008 pour l’ensemble est une autre valeur (ch. 16 §3 et §22)."
