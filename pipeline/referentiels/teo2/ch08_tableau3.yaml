  objet: "Tableau 3"
  titre: "Type de mixité d’union des répondant·es selon le lien à la migration (%)"
  auteurs: "Mathieu Ferry, Pierre Tanneau, Patrick Simon"
  url: "https://books.openedition.org/ined/26366"
  emplacement: "§17-18 (colonnes b et d et 29 % au §17 ; 12 % des majoritaires au §18)"
  image: "data/raw/spike/teo2/ch08/TABLEAUX_CHAP_8_3.jpg.jpg"
  champ: "Personnes vivant en couple, âgées de 18 à 59 ans (France métropolitaine)"
  unite: "%"
  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Champ : personnes vivant en couple, âgées de 18 à 59 ans. Lecture : 53 % des G1 sont en union avec un·e immigré·e de même origine, 8 % avec un·e descendant·e de même origine, 7 % avec un·e G1 d’une autre origine, 3 % avec un·e G2 d’une autre origine et 29 % avec une personne de la population sans ascendance migratoire. Note : (a) conjoint·e de même origine et de même lien à la migration (G1/G1 ; G2/G2 ou G2.5 ; G2,5/G2 ou G2.5) ; (b) conjoint·e de même origine et de lien à la migration différent (G1/G2 ; G2/G1 ; G2.5/G1). Les descendant·es G2.5 correspondent aux enfants de couples mixtes, les descendant·es G2 ont deux parents immigrés. Les pourcentages sont pondérés. Saisie : les cellules (a) et (b) de la ligne « Population majoritaire » sont des tirets (omises). Les sommes de ligne sont 100, 101, 100, 100, 99 (arrondis). Les « 39 / 59 / 90 % » ne sont pas dans le tableau : ce sont des sommes c + d + e."
