  note: "Source : enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Champ : France métropolitaine, personnes âgées de 18 à 59 ans. Lecture : 13 % de la population de 18 à 59 ans vivant en France métropolitaine sont immigré·es. Note : les Français·es venant de l’ancien empire colonial sont compris·es dans les « Français·es de l’étranger ». Saisie : l’unité de la colonne « Effectifs non pondérés » est « effectif » (surcharge par cellule). Les lignes en retrait détaillent la ligne qui les précède : les quatre lignes sous « Sans ascendance immigrée sur trois générations » (Outre-mer, Français de l’étranger : 1 + 1 + 1 + 4 = 7) sont incluses dans les 66 %, non additionnelles. G3 : 4 + 5 = 9 pour 10 affiché (arrondi). Aucune cellule vide."
