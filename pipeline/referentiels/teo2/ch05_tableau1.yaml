source:
  chapitre: 5
  objet: "Tableau 1"
  titre: "Proportion d’individus habitant un quartier du quintile supérieur pour chaque indicateur (%)"
  auteurs: "Giulia Ferrari, Haley McAvay, Sorana Toma"
  url: "https://books.openedition.org/ined/26345"
  emplacement: "§10-11 et §13 (tableau appelé au §10)"
  image: "data/raw/spike/teo2/ch05/TABLEAUX_CHAP_5_1.jpg.jpg"
  champ: "Répondants âgés de 18 à 49 ans (TeO1 2008 et TeO2 2019-2020), France métropolitaine"
  unite: "%"
  note: "Source : enquête Trajectoires et Origines 1, Ined-Insee, 2008 ; enquête Trajectoires et Origines 2, Ined-Insee, 2019-2020. Champ : répondants âgés de 18 à 49 ans. Lecture : en 2019, 47 % des immigrés subsahariens et de leurs descendants habitaient un quartier à forte proportion d’immigrés (classé dans le quintile supérieur). Note : les pourcentages sont pondérés. Saisie : le tableau est composé de deux blocs superposés (composition démographique, puis socioéconomique du quartier) ; les colonnes sont « <indicateur>, <année> ». Les lignes sont regroupées dans l’image sous les intertitres « Génération » (G1, G2, Population majoritaire), « Origine G1 et G2 » (Maghreb à Autres pays : G1 et G2 confondus) et « Sexe » (Hommes, Femmes, Total). Les libellés des colonnes sont la concaténation de l’en-tête de l’indicateur et de l’année. Aucune cellule vide. Le « 36 / 51 % contre 6 % » du cadrage est : non européens, 2019, Maghreb 36, Afrique subsaharienne 51, population majoritaire 6."
