    page_pdf: 58
    extrait: "France 525 0 1 473 5 459 93 794"
    valeurs: {I: 525, II: 0, III: 1473, IV: 5459, V: 93794}
  - indicateur: rapport_soutien_2050
    libelle: "Rapport de soutien potentiel en 2050 (15-64 ans pour un 65 ans ou plus)"
