# Rapport de la Division de la population de l'ONU sur les « migrations de remplacement » (2000).
# Saisie manuelle (le rapport n'existe qu'en PDF), une référence par ligne : tableau, page imprimée,
# page du fichier PDF et extrait exact. Au build, chaque extrait est cherché (espaces ignorés) dans
# le texte de sa page, et chaque valeur dans son extrait : une faute de frappe arrête le build.
# France seulement. Milliers de personnes sauf mention contraire.
source:
  cle: onu_2000
  document: "United Nations Population Division, Replacement Migration: Is It a Solution to Declining and Ageing Populations?"
  cote: "ESA/P/WP.160"
  date: "2000-03-21"
  note: "Projections de la révision 1998 des World Population Prospects. Le résumé analytique existe en français dans le même fichier (pages 1 à 6 de sa numérotation propre)."
scenarios:
  I: "Variante moyenne des projections de l'ONU (révision 1998)"
  II: "Variante moyenne, sans aucune migration après 1995"
  III: "Population totale maintenue à son maximum"
  IV: "Population de 15 à 64 ans maintenue à son maximum"
  V: "Rapport des 15-64 ans aux 65 ans ou plus maintenu à son niveau de 1995"
lignes:
