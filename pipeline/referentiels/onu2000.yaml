citations:
  # Résumé analytique, version française du rapport (numérotation propre, pages 1 à 6).
  - cle: definition
    page: 1
    page_pdf: 23
    texte: "Ce type de migrations se rapporte aux migrations internationales qui s'avéreraient nécessaires pour compenser le déclin des populations, la baisse des populations d'âge actif et pour neutraliser le vieillissement de l'ensemble des populations."
  - cle: france
    page: 5
    page_pdf: 27
    texte: "S'agissant de la France, des États-Unis, du Royaume-Uni et de l'Union européenne, le nombre des migrants nécessaires pour compenser le déclin des populations est soit inférieur soit comparable aux récentes expériences."
  - cle: court_terme
    page: 5
    page_pdf: 27
    texte: "Si les âges de la retraite demeurent grosso modo ce qu'ils sont à l'heure actuelle, l'accroissement de la population d'âge actif par le biais d'une migration internationale demeurera, pour le court et le moyen terme, le seul choix permettant de réduire l'importance de la baisse"
  - cle: vieillissement
    page: 6
    page_pdf: 28
    texte: "Le maintien des rapports de soutien potentiels à leurs niveaux actuels uniquement en ayant recours à une migration de remplacement semble inaccessible en raison du nombre extraordinairement important des migrants qui s'avéreraient nécessaires"
  - cle: age_actif
    page: 6
    page_pdf: 28
    texte: "Dans la plupart des cas, les rapports de soutien potentiels pourront être maintenus à leurs niveaux actuels en augmentant la limite supérieure de la population d'âge actif à environ 75 ans"
