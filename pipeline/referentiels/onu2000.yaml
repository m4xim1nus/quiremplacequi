    libelle: "Solde migratoire cumulé de 2000 à 2050"
    unite: milliers
    tableau: "Tableau 1, A (Total number)"
    page: 2
    page_pdf: 20
    extrait: "France 325 0 1 473 5 459 89 584"
    valeurs: {I: 325, II: 0, III: 1473, IV: 5459, V: 89584}
  - indicateur: migrants_par_an
